<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="staffGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="20%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="80%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#fde047" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="3"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="240" r="160" fill="white" opacity="0.08" filter="blur(30px)"/>

  <!-- Musical Staff Lines (5 lines) -->
  <g stroke="url(#staffGrad)" stroke-width="3.5" stroke-linecap="round">
    <line x1="64" y1="180" x2="448" y2="180"/>
    <line x1="64" y1="218" x2="448" y2="218"/>
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="64" y1="294" x2="448" y2="294"/>
    <line x1="64" y1="332" x2="448" y2="332"/>
  </g>

  <!-- Musical Notes and Accents on Staff -->
  <g opacity="0.45" fill="#fef08a">
    <!-- Mini eighth note top-right -->
    <ellipse cx="380" cy="180" rx="14" ry="10" transform="rotate(-20 380 180)"/>
    <line x1="392" y1="176" x2="392" y2="124" stroke="#fef08a" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M392 124 Q410 134 408 152" fill="none" stroke="#fef08a" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Mini note head left -->
    <ellipse cx="130" cy="294" rx="13" ry="9.5" transform="rotate(-20 130 294)"/>
    <line x1="141" y1="290" x2="141" y2="238" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Treble Clef (G-Clef) Hero Graphic -->
  <g filter="url(#glow)">
    <path fill="url(#goldGrad)" fill-rule="evenodd" d="
      M 268 96
      C 264 96 258 100 255 106
      C 248 119 245 138 245 162
